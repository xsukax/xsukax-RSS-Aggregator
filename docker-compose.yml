name: xsukax-rss
services:
  app:
    build: .
    image: xsukax/rss-aggregator:local
    container_name: xsukax-rss
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      REFRESH_WORKERS: ${REFRESH_WORKERS:-2}
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    mem_limit: 384m
    healthcheck:
      test: ["CMD","python","-c","from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8080/healthz',timeout=4).status==200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
